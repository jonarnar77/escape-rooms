<!doctype html>
<!--
  Automated playthrough of what is built so far (rooms 1-3).
    http://localhost:8000/games/hotel-lost-day/test.html?d=medium   (easy | medium | hard)
  It plays through the real hotspots, checks each one is clickable at that moment,
  and actually operates the puzzle widgets (drawer lock, torn receipt).
-->
<html><head><meta charset="utf-8"><title>Playthrough test</title>
<link rel="stylesheet" href="../../engine/engine.css"><link rel="stylesheet" href="theme.css">
<style>#out{position:fixed;top:8px;left:8px;z-index:99;background:#000c;color:#cfc;padding:10px;font:13px monospace;white-space:pre}</style></head>
<body><div id="game"></div><pre id="out">running…</pre>
<script type="module">
import { Game } from '../../engine/engine.js';
import data from './game.js';
const diff = new URLSearchParams(location.search).get('d') || 'medium';
data.id = 'playthrough-test-hotel';
history.replaceState(null, '', location.pathname);
const g = new Game(document.getElementById('game'), data);
g.newGame(diff);
const A = g.api, log = [], fail = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
const hs = (scene, id) => data.scenes[scene].hotspots.find(h => h.id === id);
function click(scene, id, item = null) {
  g.go(scene); g.render();
  const h = hs(scene, id);
  if (!h) return bad(`missing hotspot ${scene}/${id}`);
  if (!g.visible(h)) return bad(`not clickable now: ${scene}/${id}`);
  if (item && !A.has(item)) return bad(`don't have ${item} for ${scene}/${id}`);
  g.state.selected = item;
  // click where a player would: the middle of the hotspot, and make sure nothing else covers it
  const el = g.hot.querySelector(`[data-id="${id}"]`);
  const r = el.getBoundingClientRect();
  const top = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
  if (top !== el) return bad(`${scene}/${id} is covered by "${top?.dataset?.id ?? top?.tagName}"`);
  top.dispatchEvent(new MouseEvent('click', { bubbles: true }));
}
const expect = (cond, msg) => { if (!cond) fail.push('expected: ' + msg); };
function bad(msg) { fail.push(msg); }
const q = s => document.querySelector(s);
try {
  expect(A.has('booking'), 'start with booking card');
  g.examine('booking');                         expect(g.state.scene === 'r1-booking', 'booking close-up');
  click('r1-reception', 'chart');               click('r1-chart', 'chart-204'); expect(A.flag('knowsRoom'), 'knows room 204');
  click('r1-reception', 'note');                expect(A.hasNote('clerk'), 'clerk note in notebook');
  click('r1-reception', 'luggage');
  // drawer: wrong order first, then the right one, through the real buttons
  click('r1-reception', 'lock');                expect(!g.modal.hidden, 'drawer lock opens');
  const press = id => q(`.seq-btn[data-id="${id}"]`).click();
  ['star', 'star', 'star', 'star'].forEach(press); await wait(1200);
  expect(!A.flag('drawerOpen'), 'wrong order keeps drawer shut');
  const order = data.puzzles['r1-drawer'].solution(A);
  order.forEach(press); await wait(1100);
  expect(A.flag('drawerOpen'), 'drawer opens with ' + order.join(','));
  click('r1-reception', 'key204');              click('r1-reception', 'receiptHalf');
  // receipt: place the decoy first (must not solve), then the real strips
  click('r1-reception', 'basket');              expect(!g.modal.hidden, 'receipt puzzle opens');
  const pieces = () => [...document.querySelectorAll('.asm-piece')];
  const slot = n => document.querySelector(`.asm-slot[data-slot="${n}"]`);
  // pieces: p<N> = strip N of the real receipt, d<N> = decoy scraps
  const pick = id => q(`.asm-piece[data-piece="${id}"]`);
  const place = (id, n) => { pick(id).click(); slot(n).dispatchEvent(new MouseEvent('click')); };
  expect(pieces().length === (diff === 'hard' ? 5 : 4), 'scraps in the basket: ' + pieces().length);
  place('d0', 3);                                          // decoy in the right-looking spot
  place('p2', 2); place('p4', 4);
  expect(!A.flag('receiptDone'), 'decoy does not complete it');
  slot(3).dispatchEvent(new MouseEvent('click'));          // take the decoy back out
  place('p3', 3);
  await wait(1400);
  expect(A.flag('receiptDone') && A.has('receipt') && !A.has('receiptHalf'), 'receipt reassembled');
  expect(g.state.scene === 'r1-calendar', 'calendar flip shown');
  click('r1-reception', 'corridor-open');       expect(g.state.scene === 'r2-corridor', 'through the corridor door');
  log.push('reception ✓  (notebook entries: ' + g.state.notes.length + ')');

  // ROOM 2
  click('r2-corridor', 'door203', 'key204');    expect(g.state.scene === 'r2-corridor', 'wrong door stays shut');
  click('r2-corridor', 'door204', 'key204');    expect(g.state.scene === 'r2-room', 'into room 204');
  expect(g.pastBtn.hidden, 'no Yesterday button before the camera');
  click('r2-room', 'camera');                   expect(A.has('camera'), 'camera taken');
  g.render();                                   expect(!g.pastBtn.hidden, 'Yesterday button appears');
  g.togglePast();                               expect(A.past, 'viewing yesterday');
  for (const id of ['painting', 'chair', 'mirror', 'flowers']) { g.state.selected = null; g.clickHotspot(hs('r2-room', 'past-' + id)); }
  expect(['painting', 'chair', 'mirror', 'flowers'].every(id => A.hasNote('diff-' + id)), 'all four differences noted');
  expect(!g.visible(hs('r2-room', 'camera')) && g.visible(hs('r2-room', 'past-painting')), 'past-only hotspots while in the photo');
  g.togglePast();                               expect(!A.past, 'back to today');
  // suitcase lock: a wrong set first, then exactly what changed
  click('r2-room', 'suitcase');                 click('r2-suitcase', 'lock'); expect(!g.modal.hidden, 'lock opens');
  const opt = id => q(`.sel-opt[data-id="${id}"]`);
  ['painting', 'mirror', 'lamp'].forEach(id => opt(id).click()); q('.sel-go').click(); await wait(200);
  expect(!A.flag('lockOpen'), 'wrong pictures keep it locked');
  opt('lamp').click(); ['flowers', 'chair'].forEach(id => opt(id).click()); q('.sel-go').click(); await wait(1100);
  expect(A.flag('lockOpen'), 'suitcase opens');
  // message: wrong order first, then right
  click('r2-suitcase', 'envelope');             expect(!g.modal.hidden, 'message puzzle opens');
  const n = data.puzzles['r2-message'].config(A).items.length;
  const frag = id => q(`.ord-pile .ord-frag[data-id="${id}"]`);
  for (let i = n - 1; i >= 0; i--) frag('m' + i).click();
  expect(q('.ord.err'), 'reversed order is rejected');
  for (let i = n - 1; i >= 0; i--) q(`.ord-line .ord-frag[data-id="m${i}"]`).click();   // send all back
  for (let i = 0; i < n; i++) frag('m' + i).click();
  await wait(1300);                             expect(A.flag('messageDone') && g.state.scene === 'r2-message', 'message assembled');
  click('r2-room', 'mirror');                   expect(A.flag('sheetLifted'), 'sheet lifted');
  click('r2-room', 'swallow');                  expect(A.flag('serviceOpen'), 'service door released');
  expect(!g.visible(hs('r2-room', 'service')), 'armchair blocks the door');
  click('r2-room', 'chair');                    expect(A.flag('chairMoved'), 'armchair moved back');
  click('r2-room', 'service');                  expect(g.state.scene === 'r3-breakfast', 'down the service stairs');
  log.push('room 204 ✓  (notebook entries: ' + g.state.notes.length + ')');

  // ROOM 3
  g.go('r3-breakfast'); g.render();
  if (!g.state.pastView) g.togglePast();
  for (const seat of ['t1l', 't1r', 't2l', 't2r', 't3l', 't3r', 't4l']) click('r3-breakfast', 'past-' + seat);
  expect(A.hasNote('seat-t3r') && A.hasNote('seat-t2l'), 'photo plates noted');
  g.togglePast();
  click('r3-breakfast', 'spike');               expect(A.hasNote('orders'), 'order slips read');
  click('r3-breakfast', 'lostbox');             expect(!A.flag('seatingDone') && g.modal.hidden, 'lost property empty before seating');
  click('r3-breakfast', 'lectern');             click('r3-lectern', 'plan'); expect(!g.modal.hidden, 'seating plan opens');
  const token = id => q(`.asg-token[data-token="${id}"]`);
  const seat = id => q(`.asg-slot[data-slot="${id}"]`);
  const put = (t, s) => { token(t).click(); seat(s).dispatchEvent(new MouseEvent('click')); };
  // everything placed, but the two at table 2 swapped: must not solve
  put('fern0', 't1l'); put('fern1', 't1r'); put('anchor2', 't2r'); put('bell5', 't2l');
  put('swallow4', 't3l'); put('moon3', 't3r'); put('fox6', 't4l');
  await wait(200);                              expect(!A.flag('seatingDone'), 'swapped seats rejected');
  seat('t2l').dispatchEvent(new MouseEvent('click')); seat('t2r').dispatchEvent(new MouseEvent('click'));   // take both back
  put('anchor2', 't2l'); put('bell5', 't2r');
  await wait(1300);                             expect(A.flag('seatingDone') && A.hasNote('companion'), 'seating restored, companion found');
  click('r3-breakfast', 'lostbox');             expect(!g.modal.hidden, 'lost property puzzle opens');
  for (const [item, guest] of [['knitting', 'vale'], ['pipe', 'orme'], ['brooch', 'ito'], ['pen', 'brandt'], ['cane', 'okonkwo']]) put(item, guest);
  await wait(1300);                             expect(A.flag('itemsDone') && g.state.scene === 'r3-accounts', 'items returned, notes read');
  click('r3-breakfast', 'lift');
  click('r3-lift', 'call201');                  expect(!g.visible(hs('r3-lift', 'envelope')), 'wrong room: no envelope');
  click('r3-lift', 'call203');                  click('r3-lift', 'envelope');
  expect(A.has('dancecard') && g.state.scene === 'r3-letter', 'letter read, dance card in hand');
  click('r3-breakfast', 'ballroom');            expect(A.flag('ballroomOpen'), 'ballroom unlocked just by clicking, card in hand');
  click('r3-breakfast', 'ballroom-open');       expect(g.state.scene === 'r4-ballroom', 'into the ballroom');
  log.push('breakfast room ✓  (notebook entries: ' + g.state.notes.length + ')');
} catch (e) { fail.push('ERROR ' + e.message); }
g.clearSave();
document.getElementById('out').textContent =
  `PLAYTHROUGH (${diff})\n` + log.join('\n') + '\n' + (fail.length ? 'FAIL\n' + fail.join('\n') : 'PASS');
</script></body></html>
